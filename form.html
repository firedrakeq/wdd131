<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form | WDD 131</title>
  <meta name="description" content="Submit a product review with star ratings, installation date, and feature feedback for WDD 131.">
  <meta name="author" content="Quentin Chime">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <div class="form-group">
        <label for="product">Product Name <span class="req">*</span></label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="form-group">
        <legend>Overall Rating <span class="req">*</span></legend>
        <div class="rating-row">
          <div class="radio-item">
            <label for="rate1">&#9733;</label>
            <input type="radio" id="rate1" name="rating" value="1" required>
          </div>
          <div class="radio-item">
            <label for="rate2">&#9733;&#9733;</label>
            <input type="radio" id="rate2" name="rating" value="2" required>
          </div>
          <div class="radio-item">
            <label for="rate3">&#9733;&#9733;&#9733;</label>
            <input type="radio" id="rate3" name="rating" value="3" required>
          </div>
          <div class="radio-item">
            <label for="rate4">&#9733;&#9733;&#9733;&#9733;</label>
            <input type="radio" id="rate4" name="rating" value="4" required>
          </div>
          <div class="radio-item">
            <label for="rate5">&#9733;&#9733;&#9733;&#9733;&#9733;</label>
            <input type="radio" id="rate5" name="rating" value="5" required>
          </div>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="installDate">Date of Installation <span class="req">*</span></label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="form-group">
        <legend>Which features did you find useful? <em>(Check all that apply)</em></legend>
        <div class="checkbox-list">
          <div class="check-item">
            <input type="checkbox" id="featDurability" name="features" value="Durability">
            <label for="featDurability">Durability</label>
          </div>
          <div class="check-item">
            <input type="checkbox" id="featEase" name="features" value="Ease of Use">
            <label for="featEase">Ease of Use</label>
          </div>
          <div class="check-item">
            <input type="checkbox" id="featPerformance" name="features" value="Performance">
            <label for="featPerformance">Performance</label>
          </div>
          <div class="check-item">
            <input type="checkbox" id="featDesign" name="features" value="Design">
            <label for="featDesign">Design</label>
          </div>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="writtenReview">Written Review <span class="opt">(Optional)</span></label>
        <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="userName">Your Name <span class="opt">(Optional)</span></label>
        <input type="text" id="userName" name="userName">
      </div>

      <input type="submit" value="Post Review" class="submit-btn">
    </form>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> | Quentin Chime | Enugu, Nigeria</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
