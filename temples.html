<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W02 Assignment: Temple Picture Album</title>
    <meta name="description" content="A responsive temple picture album featuring grid layouts, mobile navigation, and dynamic content scripts for WDD 131.">
    <!-- Google Fonts API Link (Using Roboto and Roboto Slab) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- Stylesheets: Mobile-First order -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 768px)">
    <!-- Deferred Javascript Execution -->
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Temple Album</h1>
            <button id="menu-button" aria-label="Toggle Menu">☰</button>
        </div>
        <nav>
            <ul id="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Explore Beautiful Temples</h2>
        <div class="gallery-grid">
            <!-- 9 required figure elements with placeholders -->
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Temple 1" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Temple 2" loading="lazy">
                <figcaption>Nauvoo Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Temple 3" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Temple 4" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Temple 5" loading="lazy">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Temple 6" loading="lazy">
                <figcaption>Laie Hawaii Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Temple 7" loading="lazy">
                <figcaption>Washington D.C. Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Temple 8" loading="lazy">
                <figcaption>Frankfurt Germany Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Temple 9" loading="lazy">
                <figcaption>San Diego California Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> | Quentin Chime | Nigeria</p>
        <p id="last-modified">Last Modified: </p>
    </footer>
</body>
</html>
