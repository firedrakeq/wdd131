<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W02 Assignment: Temple Picture Album</title>
    <meta name="description" content="A responsive temple picture album featuring grid layouts, mobile navigation, and dynamic content scripts for WDD 131.">
    <meta name="author" content="Quentin Chime">
    <!-- Corrected Google Fonts Integration Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Application Stylesheets -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 768px)">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Temple Album</h1>
            <button id="menu-button" aria-label="Toggle Menu">☰</button>
        </div>
        <nav>
            <ul id="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Explore Beautiful Temples</h2>
        <div class="gallery-grid">
            <!-- 9 required figures populated for validation checks -->
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Salt Lake Temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Nauvoo Temple" loading="lazy">
                <figcaption>Nauvoo Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Rome Italy Temple" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Paris France Temple" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Tokyo Japan Temple" loading="lazy">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Laie Hawaii Temple" loading="lazy">
                <figcaption>Laie Hawaii Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Washington D.C. Temple" loading="lazy">
                <figcaption>Washington D.C. Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of Frankfurt Germany Temple" loading="lazy">
                <figcaption>Frankfurt Germany Temple</figcaption>
            </figure>
            <figure>
                <img src="https://picsum.photos" alt="Placeholder view of San Diego California Temple" loading="lazy">
                <figcaption>San Diego California Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> | Quentin Chime | Nigeria</p>
        <p id="last-modified">Last Modified: </p>
    </footer>
</body>
</html>
